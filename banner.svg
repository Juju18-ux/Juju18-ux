<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Fabian Owuor banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#1a1038"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#e0f7ff"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="260" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- colour blobs behind the glass -->
    <g filter="url(#blur)">
      <circle cx="170" cy="70" r="95" fill="#00d9ff" opacity="0.75">
        <animate attributeName="cx" values="170;260;170" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;120;70" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="220" r="90" fill="#7c3aed" opacity="0.8">
        <animate attributeName="cx" values="520;430;520" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="850" cy="70" r="100" fill="#ec4899" opacity="0.6">
        <animate attributeName="cx" values="850;760;850" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;140;70" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- frosted glass card -->
    <g filter="url(#shadow)">
      <rect x="60" y="35" width="880" height="190" rx="26" fill="url(#glass)"/>
    </g>
    <rect x="60.5" y="35.5" width="879" height="189" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M86 36 H914" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>

    <!-- text -->
    <text x="500" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="bold" fill="#000000">Fabian Owuor</text>
    <text x="500" y="146" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#000000" opacity="0.8" letter-spacing="1.5">AI and Machine Learning  |  Full-Stack Web  |  Cloud  |  IT Support</text>

    <!-- glass chips -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle">
      <rect x="318" y="170" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.45" stroke="#000000" stroke-opacity="0.35"/>
      <text x="373" y="191">Python</text>
      <rect x="440" y="170" width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.45" stroke="#000000" stroke-opacity="0.35"/>
      <text x="500" y="191">TensorFlow</text>
      <rect x="572" y="170" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.45" stroke="#000000" stroke-opacity="0.35"/>
      <text x="627" y="191">React</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
